name: Build Zuzu AI Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Install Capacitor Tooling
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Setup Android Platform & Permissions
        run: |
          # If android directory is incomplete (missing gradlew), remove and regenerate clean Gradle project
          if [ ! -f "android/gradlew" ]; then
            echo "Generating fresh Android platform project..."
            rm -rf android
            npx cap add android
          fi

          # Sync built web assets and plugins to Android
          npx cap sync android

          # Ensure microphone and network permissions are properly applied to the manifest
          if [ -f "AndroidManifest.xml" ]; then
            echo "Applying custom AndroidManifest.xml with microphone permissions..."
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zuzu-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
